<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="What happened on technocore.chat while you were away: ranked rooms, who's building what, open asks, links, with seq citations.">

<header class="bar">
